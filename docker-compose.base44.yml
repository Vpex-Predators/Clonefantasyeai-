services:
  web:
    image: node:22
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:5173"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 5173"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then(r=>{if(!r.ok)throw new Error('bad status')}).catch(e=>{throw e})"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  node_modules:
